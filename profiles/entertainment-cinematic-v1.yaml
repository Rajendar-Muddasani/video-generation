profile_id: entertainment-cinematic-v1
display_name: Entertainment Cinematic v1
genre: entertainment
description: Starter profile for future dramatic or series-style storytelling with richer motion and a slightly higher retry budget.
plan:
  video_mode: animated
  languages:
    - en
source_images:
  provider: existing
  dir_template: output/{story_id}
  naming_contract: slide01_shot01_raw.jpg
animation:
  provider: local
  backend: ltx-diffusers
  model: Lightricks/LTX-Video
  generate_script: scripts/generate_ltx_shots.py
  output_dir_template: selfhosted/{story_id}/{profile_id}/clips
  defaults_override:
    provider: local
    model: Lightricks/LTX-Video
    model_input: image
    shot_duration_seconds: 4
    shots_per_slide: 2
    aspect_ratio: '16:9'
    resolution: 480p
    frames_per_second: 24
    segment_strategy: hybrid_loop
    estimated_cost_per_video: 0.0
    max_estimated_cost_usd: 8.0
  worker_args:
    width: 704
    height: 480
    fps: 24
    seconds: 4
    steps: 10
    guidance_scale: 1.0
    dtype: bfloat16
    device: cuda
    cpu_offload: false
    seed: 7
    negative_prompt: worst quality, blurry, jittery, distorted, flicker, awkward anatomy, text artifacts
assembly:
  final_dir_template: output/{story_id}
  reuse_shots_across_languages: false
budget:
  target_cost_usd: 8.0
  max_gpu_hours: 3.0
  retry_slide_limit: 3
  notes: Use only when the series format actually benefits from extra coverage.
quality_control:
  inspect_source_stills_before_motion: true
  inspect_contact_sheet_after_motion: true
  validate_final_mp4: true
  notes: Re-render only the dramatic beats that need stronger motion.