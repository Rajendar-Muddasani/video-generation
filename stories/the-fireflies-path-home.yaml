slides_en:
- eyebrow: ''
  title: The Fireflies' Path Home
  dall_e_prompt: moonlit Indian forest wrapped in gentle blue fog; deer, rabbit, and fox notice familiar trails are hidden
    but the mood stays calm and hopeful.
  narration: Under the soft glow of the moon, a tranquil Indian forest rests, wrapped in a gentle blue fog. Amidst the trees,
    deer, rabbit, and fox pause, noticing how their familiar trails have become hidden. Yet, the mood remains calm, filled
    with a hopeful serenity. The forest whispers a soothing lullaby, inviting them to explore with gentle curiosity. Within
    this magical scene, the animals sense a promise of guidance, as if the forest holds a secret path waiting to be revealed.
    This is where their journey begins, a journey of friendship and kindness lighting the way.
- eyebrow: ''
  title: Deer and Rabbit Wait Together
  dall_e_prompt: A gentle deer and a fluffy rabbit standing close together beside a hidden meadow path in a moonlit Indian
    forest, soft blue fog curling around tree roots, warm golden fireflies beginning to glow, calm hopeful bedtime mood, no
    text or letters.
  narration: The deer longs for the soft embrace of the meadow, while the rabbit dreams of the cozy warmth of the burrow.
    They share their hopes with one another, finding comfort in their companionship. Instead of rushing, they decide to enjoy
    the journey together. As gentle breezes rustle through the leaves, a peaceful understanding grows between them. They realize
    that even though their paths are hidden, they need not worry, for their friendship will guide them. Together, they promise
    to take each step with patience, knowing that their hearts are open to the wonders that lie ahead.
- eyebrow: ''
  title: Fox and Turtle Take Their Time
  dall_e_prompt: A clever fox with a soft bushy tail and a steady turtle beside fern-covered stones in a misty moonlit Indian
    forest, gentle blue fog, quiet golden fireflies, safe patient atmosphere, cozy children's watercolor style, no text or
    letters.
  narration: Beside the lush green ferns, the clever fox and the steady turtle meet. The fox, quick and clever, finds himself
    unable to see through the fog. The turtle, slow yet determined, moves steadily forward. They understand that patience
    is their ally when paths seem unclear. With soft whispers and thoughtful pauses, they learn to balance the turtle's steadiness
    with the fox's cleverness. As they journey side by side, they discover that by trusting each other's strengths, they can
    navigate any uncertainty with ease and grace, embracing the beauty of their shared adventure.
- eyebrow: ''
  title: Birds and Squirrels Listen
  dall_e_prompt: Small birds perched on misty branches and playful squirrels near a hollow tree, listening carefully in a
    blue-fog moonlit Indian forest, soft leaves, warm firefly lights, peaceful friendly bedtime scene, no text or letters.
  narration: In search of their tree and hollow, birds and squirrels move through the forest with keen ears. They listen intently
    to the rustling leaves, the gentle wind, and the reassuring calls of their friends. Realizing they are not alone, they
    decide to call out to their companions. A chorus of chirps and chatters fills the air, creating a melody of togetherness.
    As the forest comes alive with their harmonious song, they understand that the path to their home becomes clearer with
    each note sung in unison, echoing the warmth of their shared journey.
- eyebrow: ''
  title: Wise Friends Gather
  dall_e_prompt: A wise owl on a branch, a kind elephant, a playful monkey, and a graceful peacock gathering with friendly forest
    animals under moonlight, blue fog, golden fireflies, reassuring magical Indian forest mood, no text or letters.
  narration: The wise owl, gentle elephant, playful monkey, and beautiful peacock gather to encourage everyone. Each animal
    brings a special gift—wisdom, strength, joy, and beauty—but they know that no single gift holds the complete answer. With
    kindness and understanding, they share their gifts, creating a tapestry of support. Together, they inspire each animal
    to shine brightly, knowing that their combined warmth will illuminate the path forward. In this forest of friendship,
    they realize that every creature's light adds to the glow of the magical journey they all embark upon.
- eyebrow: ''
  title: The Fireflies Listen
  dall_e_prompt: Tiny golden fireflies gathering around deer, rabbit, fox, turtle, birds, squirrels, owl, monkey, elephant,
    and peacock in a foggy moonlit Indian forest, each animal calm and hopeful, warm glow through blue mist, no text or letters.
  narration: As the forest listens, tiny golden fireflies begin to appear, their lights twinkling like stars in the night.
    They gather around each animal, hearing their stories and understanding their needs. With gentle promises, the fireflies
    agree to create safe, glowing paths through the fog. Their golden lights dance gracefully, weaving trails that shimmer
    with warmth and hope. The animals watch in awe as the forest transforms, feeling a renewed sense of trust and belonging.
    Together, they prepare to follow these luminous paths, guided by the kindness of the fireflies.
- eyebrow: ''
  title: Paths of Golden Light
  dall_e_prompt: Fireflies forming several glowing golden paths through soft blue fog in a moonlit Indian forest, animals gently
    following toward meadow, burrow, pond, tree, and hollow, cozy safe magical bedtime atmosphere, no text or letters.
  narration: The fireflies form warm trails leading to the meadow, burrow, pond, tree, and hollow, each pathway glowing with
    a gentle light. The animals follow slowly, watching as the forest around them becomes less confusing. The light guides
    them, and with every step, the path feels more familiar. The golden trails offer comfort and clarity, revealing the way
    home. As the animals journey along these glowing paths, they embrace the peace that surrounds them, knowing that they
    are not alone, but part of a community that cares for one another.
- eyebrow: ''
  title: Helping on the Way Home
  dall_e_prompt: Friendly forest animals helping one another along glowing firefly paths, elephant steadying little ones, birds
    guiding from branches, fox waiting kindly for turtle, moonlit blue fog and warm golden lights, no text or letters.
  narration: Throughout the journey, the animals support each other with kindness. The gentle elephant helps steady the little
    ones, while the birds guide from the branches above. The playful monkey brings smiles to everyone, and the fox, with patience,
    waits for the turtle. Together, they move forward, each contributing to the safety and happiness of the group. As they
    travel, the warmth of their friendships shines brightly, lighting the way through the forest. With every step, they grow
    closer, their hearts filled with gratitude for the shared journey.
- eyebrow: ''
  title: Home Safe and Warm
  dall_e_prompt: Deer, rabbit, fox, turtle, birds, squirrels, owl, monkey, elephant, and peacock arriving safely near cozy forest
    homes, golden fireflies glowing proudly, moonlit Indian forest with soft blue fog, peaceful grateful mood, no text or letters.
  narration: As they reach their homes safely, each animal thanks the fireflies for their guidance. The fireflies, glowing
    softly, explain that small acts of kindness, when shared by many, become a brilliant light that can guide and comfort
    all. The animals nod in understanding, feeling grateful for the lesson they have learned. With hearts full of warmth,
    they settle into their homes, knowing that their friendships have created a special bond that will always light their
    way. Together, they find peace, ready to dream under the gentle embrace of the moon.
- eyebrow: ''
  title: Goodnight
  dall_e_prompt: forest rests peacefully, fireflies glow like tiny stars, moonlight covers every home; moral and gentle bedtime
    close.
  narration: As the forest rests peacefully, the fireflies continue to glow like tiny stars, casting a gentle light over every
    home. The moonlight wraps each animal in a comforting embrace, whispering a lullaby of love and safety. The warmth of
    friendship lingers in the air, a reminder of the kindness that lights the way. With hearts content, the animals drift
    into a restful sleep, their dreams filled with the promise of another day together. Goodnight, dear friends, may your
    dreams be as bright and gentle as the fireflies' path.
slides_te:
- eyebrow: ''
  title: మిణుగురుల ఇంటి దారి
  dall_e_prompt: చంద్రకాంతి లో భారత అడవి, నీలపు పొగతో కప్పబడిన; జింక, కుందేలు, మరియు నక్క తమ పరిచయం ఉన్న మార్గాలు దాగినట్లు
    గమనిస్తారు కానీ మనసు ప్రశాంతం మరియు ఆశాభావంగా ఉంటుంది.
  narration: ఆ రాత్రి అడవిలో మెల్లగా పొగమంచు కమ్ముకుంది. చెట్ల మధ్య దారులు స్పష్టంగా కనిపించలేదు. జింక, కుందేలు, నక్క దారిలో ఆగిపోయాయి. వాళ్లకు తమ ఇళ్ల దారి తెలుసు, కానీ ఈ చీకటిలో ఏ దారి ఏదో అర్థం కాలేదు. అయినా ఎవరూ గట్టిగా అరవలేదు. జింక మెల్లగా చెప్పింది, "మనమంతా కలిసి ఉంటే దారి దొరుకుతుంది." ఆ మాట విని అందరికీ కొంచెం ధైర్యం వచ్చింది. అదే సమయంలో గడ్డిలో చిన్న బంగారు వెలుగులు మెరవడం మొదలైంది.
- eyebrow: ''
  title: జింక, కుందేలు కలిసి ఉన్నాయి
  dall_e_prompt: చంద్రకాంతి భారత అడవిలో దాగిన మైదాన దారి పక్కన సున్నితమైన జింక మరియు మృదువైన కుందేలు కలిసి నిలబడిన దృశ్యం,
    నీలి పొగమంచు, చిన్న బంగారు మిణుగురులు, సురక్షితమైన ప్రశాంత నిద్రా వాతావరణం, అక్షరాలు లేకుండా.
  narration: జింకకు మైదానం దగ్గర ఉన్న తన ఇల్లు గుర్తొచ్చింది. కుందేలుకు తన చిన్న ఇల్లు గుర్తొచ్చింది. "నాకు అమ్మ దగ్గరకు వెళ్లాలి," అని కుందేలు మెల్లగా చెప్పింది. జింక దాని పక్కనే నిలబడి, "భయం పెట్టుకోకు. మనం కలిసి వెళ్దాం," అంది. గాలి ఆకులను మెల్లగా కదిలించింది. కుందేలు జింక దగ్గరగా నిలబడింది. వాళ్లు తొందరపడలేదు. ముందు చుట్టూ శబ్దాలు విన్నారు. తర్వాత నేల మీద ఉన్న చిన్న అడుగుల గుర్తులు చూశారు. కలిసి ఉన్నప్పుడు చీకటి కూడా అంత భయంగా అనిపించలేదు.
- eyebrow: ''
  title: నక్క, తాబేలు నెమ్మదిగా వచ్చాయి
  dall_e_prompt: పొగమంచు చంద్రకాంతిలో పచ్చని ఫెర్న్ మొక్కల దగ్గర తెలివైన నక్క మరియు స్థిరమైన తాబేలు, చుట్టూ మృదువైన నీలి
    పొగమంచు, బంగారు మిణుగురులు, ఓపికతో నిండిన స్నేహపూర్వక దృశ్యం, అక్షరాలు లేకుండా.
  narration: కొద్దిసేపటికి నక్క, తాబేలు కూడా అక్కడికి వచ్చాయి. నక్క వేగంగా నడిచే జంతువు, కానీ పొగమంచులో అది కూడా దారి చూడలేకపోయింది. తాబేలు చాలా నెమ్మదిగా నడిచింది, కానీ ఆగలేదు. "మనకు తొందర అవసరం లేదు," తాబేలు అంది. "సేఫ్‌గా వెళ్లాలి." నక్క తల ఊపింది. "నేను ముందుగా చూస్తాను. నువ్వు నెమ్మదిగా రా," అంది. అలా వాళ్లు ఒకరికి ఒకరు సహాయం చేస్తూ ముందుకు కదిలారు. చిన్న సహాయం కూడా ఆ రాత్రి పెద్ద ధైర్యంగా మారింది.
- eyebrow: ''
  title: పక్షులు, ఉడుతలు శబ్దాలు విన్నాయి
  dall_e_prompt: పొగమంచు కొమ్మలపై చిన్న పక్షులు, చెట్టు తొర్ర దగ్గర ఉడుతలు, నీలి చంద్రకాంతి అడవిలో ఆకుల చప్పుడు వినే దృశ్యం,
    బంగారు మిణుగురులు, ప్రశాంతమైన మృదువైన వాతావరణం, అక్షరాలు లేకుండా.
  narration: పై కొమ్మల మీద చిన్న పక్షులు కూర్చున్నాయి. చెట్టు రంధ్రం దగ్గర ఉడుతలు ఉన్నాయి. వాళ్లు కూడా తమ ఇళ్ల దారి కోసం చూస్తున్నారు. పక్షులు చుట్టూ ఉన్న శబ్దాలు జాగ్రత్తగా విన్నాయి. గాలి శబ్దం, ఆకుల శబ్దం, దూరంగా నీటి శబ్దం వినిపించాయి. "మనమంతా ఒకరిని ఒకరు పిలిస్తే బాగుంటుంది," అని ఒక పక్షి చెప్పింది. వెంటనే పక్షులు మృదువుగా కూత పెట్టాయి. ఉడుతలు చిన్నగా చప్పుడు చేశాయి. అడవిలో ఉన్న స్నేహితులందరికీ, "మేము ఇక్కడ ఉన్నాం," అనే మాటలా ఆ శబ్దాలు వినిపించాయి.
- eyebrow: ''
  title: మంచి స్నేహితులు చేరారు
  dall_e_prompt: కొమ్మపై జ్ఞానమైన గుడ్లగూబ, దయగల ఏనుగు, చలాకీ కోతి, అందమైన నెమలి, చంద్రకాంతి పొగమంచు అడవిలో జంతువులతో కలిసి
    నిలబడి ధైర్యం ఇచ్చే దృశ్యం, బంగారు మిణుగురులు, అక్షరాలు లేకుండా.
  narration: ఒక కొమ్మ మీద గుడ్లగూబ కూర్చొని చూసింది. ఏనుగు నెమ్మదిగా వచ్చి, చిన్న జంతువుల పక్కన నిలబడింది. కోతి చెట్టు మీద నుంచి, "అందరూ ప్రశాంతంగా ఉండండి," అని చెప్పింది. నెమలి తన రెక్కలను దగ్గరగా పెట్టుకుని నడిచింది. ప్రతి జంతువు ఏదో ఒక విధంగా సహాయం చేయగలదని వాళ్లందరికీ అర్థమైంది. ఏనుగు బలంగా ఉంది. గుడ్లగూబ దూరం వరకు చూడగలదు. పక్షులు పై నుంచి దారి చూడగలవు. చిన్న కుందేలు కూడా వినగలదు. అందరూ కలిసి ఉంటే చీకటి తక్కువగా అనిపించింది.
- eyebrow: ''
  title: మిణుగురులు వచ్చాయి
  dall_e_prompt: పొగమంచు చంద్రకాంతి భారత అడవిలో చిన్న బంగారు మిణుగురులు జంతువుల చుట్టూ చేరిన దృశ్యం, జింక, కుందేలు, నక్క,
    తాబేలు, పక్షులు, ఉడుతలు, ఏనుగు, కోతి, నెమలి ప్రశాంతంగా చూస్తూ, అక్షరాలు లేకుండా.
  narration: అప్పుడు గడ్డి మధ్య నుంచి మిణుగురులు బయటకు వచ్చాయి. ఒక్కటి, రెండు, మూడు... కొద్దిసేపటికి చాలా చిన్న బంగారు వెలుగులు కనిపించాయి. అవి ప్రతి జంతువు దగ్గరికి వచ్చాయి. "మీరు ఎక్కడికి వెళ్లాలి?" అని అడిగినట్లుగా మెల్లగా చుట్టూ తిరిగాయి. జింక మైదానం దారి చూపించింది. కుందేలు తన ఇల్లు ఎక్కడో చెప్పింది. తాబేలు చెరువు దారి చెప్పింది. పక్షులు తమ చెట్టు వైపు చూశాయి. మిణుగురులు అన్నీ జాగ్రత్తగా విన్నాయి. తర్వాత అవి చిన్న చిన్న వెలుగులతో దారులు చేయడం మొదలుపెట్టాయి.
