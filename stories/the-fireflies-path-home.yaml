  narration: చివరికి అందరూ తమ తమ ఇళ్లకు చేరుకున్నారు. జింక తన మైదానం దగ్గర ఆగింది. కుందేలు తన ఇంట్లోకి వెళ్లింది. తాబేలు చెరువు దగ్గర సంతోషంగా చూసింది. పక్షులు తమ చెట్టు కొమ్మలపై కూర్చున్నాయి. ప్రతి జంతువు మిణుగురులకు ధన్యవాదాలు చెప్పింది. మిణుగురులు మెల్లగా మెరిశాయి. "మేము చిన్నవాళ్లమే," అవి చెప్పినట్లుగా కనిపించాయి, "కానీ కలిసి ఉంటే దారి చూపగలం." జంతువులు ఆ మాటను హృదయంలో పెట్టుకున్నాయి. చిన్న సహాయం కూడా ఎవరికైనా పెద్ద ధైర్యం అవుతుందని అందరూ నేర్చుకున్నారు.
