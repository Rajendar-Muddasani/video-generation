  narration: >-
    గడ్డి మధ్య నుంచి చిన్న చిన్న మిణుగురులు ఒక్కొక్కటిగా బయటకు వచ్చాయి. అవి రెక్కలు ఉన్న చిన్న దీపాల్లా కనిపించాయి. చిన్న కుందేలు ఏడుపు ఆపి వాటిని చూసింది. "ఇవి మనకు దారి చూపిస్తాయా?" అని అడిగింది. "చూపిస్తాయి," తారా అంది. "చిన్న వెలుగులు కలిస్తే పెద్ద సహాయం చేయగలవు." మిణుగురులు నెమ్మదిగా ఒక వరుసగా కదిలాయి. అవి చాలా ఎక్కువగా మెరవలేదు. చిన్న కాళ్లు దారిని చూసేంత వెలుగు మాత్రమే ఇచ్చాయి. తారా వాటికి ధన్యవాదాలు చెప్పింది. కుందేలు కూడా "థ్యాంక్యూ చిన్న వెలుగులారా" అని మెల్లగా చెప్పింది.
