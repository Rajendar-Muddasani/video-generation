  title: A Promise on the Path
  dall_e_prompt: Cute realistic deer standing protectively beside the tiny baby rabbit on a narrow forest path, soft brown fur, fluffy rabbit fur, moonless dark forest, dense tree canopy and branches blocking the sky, no moon, no glowing disk or round object above the trees, warm firefly dots in the distance, calm hopeful animated film still, no text or letters.
  narration: >-
    Tara stood beside the baby rabbit like a quiet tree in the night. The rabbit stayed close to her front legs, feeling a little braver. "What if the path is gone?" the rabbit whispered. Tara shook her head softly. "A path is not gone just because we cannot see it clearly," she said. "Sometimes we need a little help, and sometimes we need a little patience." The leaves moved in the cool breeze. Far away, one tiny golden light blinked. Then another light blinked. Tara lifted her ears and smiled. "Look," she said, "our friends are coming."
- eyebrow: ''
  title: The Fireflies Gather
  dall_e_prompt: Many warm golden fireflies gathering around a cute realistic deer and tiny baby rabbit in a dark Indian forest, glowing dots forming a soft trail, gentle magical bedtime atmosphere, cinematic depth, moonless sky hidden behind tree branches, no text or letters.
  narration: >-
    Little fireflies floated out from the grass, one by one. They looked like tiny lamps with wings. The baby rabbit stopped crying and watched them with wide eyes. "Can they show us the way?" she asked. "Yes," Tara said. "Small lights can do big things when they stay together." The fireflies moved in a slow, gentle line. They did not shine too brightly. They shone just enough for little feet to follow. Tara thanked them, and the rabbit whispered, "Thank you, little lights." Then they began walking along the golden dotted path.
- eyebrow: ''
  title: Across the Little Stream
  dall_e_prompt: Cute realistic deer helping a tiny fluffy baby rabbit cross a shallow sparkling stream in a moonless dark forest, fireflies glowing over the water like golden dots, safe gentle movement, premium children's animated movie still, no text or letters.
  narration: >-
    Soon they reached a small stream. The water made a soft shh-shh sound over smooth stones. The baby rabbit stepped back. "It is too wide for me," she said. Tara looked for the safest stones and placed one hoof carefully. "You do not have to jump far," she said. "Put your paw where the light falls." The fireflies gathered over each stone like little golden signs. One step. Two steps. Three steps. The rabbit crossed the stream without falling. She laughed a tiny laugh, and the forest seemed to smile with her.
- eyebrow: ''
  title: The Tall Grass Whispers
  dall_e_prompt: Tall soft grass moving in a gentle night breeze, tiny fluffy baby rabbit staying close beside a kind cute realistic deer, fireflies lighting a narrow safe path, old tree shapes and dense leafy canopy in background, calm moonless forest, no moon, no circular sky light, no text or letters.
  narration: >-
    After the stream, the path passed through tall grass. The grass brushed against the rabbit's ears and made whispering sounds. The baby rabbit held still. "Is someone hiding there?" she asked. Tara listened carefully. There was only the wind, a sleepy cricket, and the rustle of leaves. "The grass is just saying goodnight," Tara said. "When we are scared, every small sound feels big. Let us listen together." They stood quietly. The rabbit heard the cricket, then the breeze, then Tara's calm breathing. Her own breathing became calm too, and she was ready to walk again.
- eyebrow: ''
  title: The Owl Near the Banyan Tree
  dall_e_prompt: Friendly owl sitting on an old banyan tree branch, cute realistic deer and tiny fluffy baby rabbit below, fireflies glowing around hanging roots, dark blue moonless forest with the sky fully hidden by leaves and branches, no moon, no glowing disk behind the owl, reassuring cinematic bedtime mood, no text or letters.
  narration: >-
    Near the old banyan tree, a soft voice called, "Hoo-hoo, little travelers." A kind owl sat on a low branch, blinking slowly. The baby rabbit looked up. "Do you know where my mommy is?" she asked. The owl turned his head toward a small hill. "I heard Mother Rabbit calling near the burrow by the red flowers," he said. "Follow the fireflies past this tree, and you will hear her soon." Tara bowed her head. "Thank you, Owl." The baby rabbit felt hope jump inside her heart. Mommy was not far away now.
- eyebrow: ''
  title: Mommy's Voice
  dall_e_prompt: Tiny fluffy baby rabbit and cute realistic deer following brighter fireflies toward a cozy burrow near small red forest flowers, loving mother rabbit visible in the distance, dense leafy canopy overhead with no visible sky opening, no moon, no bright circular object, warm safe glow in dark forest, no text or letters.
  narration: >-
    The fireflies made their lights a little brighter for the last part of the path. Tara and the baby rabbit walked past the banyan tree, around the soft red flowers, and toward a cozy burrow under a small hill. Then the baby rabbit heard it. "Chinni! Chinni!" It was her mommy's voice. The little rabbit's ears lifted high. "Amma!" she called. Mother Rabbit came running from the burrow, her face full of love and relief. The baby rabbit ran into her mommy's arms, safe and warm at last.
- eyebrow: ''
  title: Thank You, Little Lights
  dall_e_prompt: Loving mother rabbit hugging the tiny baby rabbit near a cozy burrow, cute realistic deer standing kindly nearby, fireflies glowing proudly around them, dark moonless forest feeling safe and peaceful, premium animated movie still, no text or letters.
  narration: >-
    Mother Rabbit hugged her baby close. "Thank you, Tara," she said. "And thank you, little fireflies." The fireflies blinked softly, as if they were smiling. The baby rabbit looked at Tara and said, "I was scared, but you stayed with me." Tara smiled. "That is what kindness does," she said. "It stays beside someone until the way feels clear." The baby rabbit nodded and looked at the fireflies. She had learned that even a tiny light can help a worried heart. And when many tiny lights work together, the whole path becomes gentle.
- eyebrow: ''
  title: Goodnight, Little One
  dall_e_prompt: Peaceful moonless forest at bedtime, mother rabbit and baby rabbit resting near cozy burrow, cute realistic deer walking home, dense tree canopy filling the upper frame, no moon, no planet, no bright circular light in the sky, fireflies glowing like tiny stars, soft cinematic goodnight atmosphere, no text or letters.
  narration: >-
    The new moon night was still dark, but it no longer felt lonely. The baby rabbit rested beside her mommy, warm and safe. Tara walked back through the quiet forest, guided by the last few fireflies. The trees swayed slowly, the stream whispered softly, and every little home in the forest felt peaceful. Remember, little one: when we stay kind and calm, even a small light can help someone reach home safely. Now close your eyes, take one slow breath, and let your dreams glow softly. Goodnight, sleep tight, and may your heart feel safe until morning.
