  title: The Baby Rabbit Is Lost
  dall_e_prompt: 'First meeting scene: tiny fluffy baby rabbit with worried expressive eyes sitting under soft leaves near a forest bush while a cute realistic deer bends kindly toward her for the first time, dark moonless forest with dense leafy canopy covering the entire sky area, no moon, no circular light in the sky, warm golden fireflies as the only lights, gentle safe bedtime mood, no text or letters.'
  narration: >-
    The baby rabbit wiped her cheeks with her small paws. "I came out to smell the jasmine flowers," she said, "but then the night became too dark. I cannot find my burrow. I want my mommy." Tara listened without rushing her. She looked at the soft ground, the tall grass, and the quiet trees. The path was hard to see, but Tara smiled gently. "We will find your mommy together," she said. "First, take one slow breath with me. In... and out. Good. Now we will walk step by step."
