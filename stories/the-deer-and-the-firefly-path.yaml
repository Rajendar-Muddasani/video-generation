  narration: >-
    One new moon night, the forest became darker than usual. There was no moon in the sky, only soft blue shadows under the trees. A gentle deer named Tara walked slowly along the quiet path. She was not afraid, because she knew the forest well. But near a small bush, she heard a tiny sound. It was a baby rabbit crying softly. The little rabbit had round wet eyes and trembling ears. Tara lowered her head and spoke in a warm voice. "I am here. You are safe. Tell me what happened."
